<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kerala Escape 2026</title>
<style>
:root{--bg:#F8F9FB;--card:#fff;--ink:#222a35;--navy:#17243A;--pri:#17243A;--co:#FF6B5E;--sky:#DCEEFF;--mut:#667085;--bd:#e4e7ec;--sh:0 2px 12px rgba(23,36,58,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--card:#17243A;--ink:#e8edf5;--pri:#FF6B5E;--sky:#223c60;--mut:#9fb0c8;--bd:#2a3b55;--sh:none}}
:root[data-theme="dark"]{--bg:#0d1420;--card:#17243A;--ink:#e8edf5;--pri:#FF6B5E;--sky:#223c60;--mut:#9fb0c8;--bd:#2a3b55;--sh:none}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:900px;margin:0 auto;padding:0 14px 96px}
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer}
nav button i{font-style:normal;font-size:1.3rem}nav button.on{color:var(--co);font-weight:600}
@media(min-width:720px){nav{bottom:auto;top:env(safe-area-inset-top,0px);border-top:0;border-bottom:1px solid var(--bd);padding:8px 24px;justify-content:center;gap:12px}nav button{flex:none;flex-direction:row;font-size:.95rem;padding:6px 14px;gap:6px}main{padding-top:64px}.hero{margin-top:-64px;padding-top:90px}}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}h3{font-size:1.1rem}
.hero{position:relative;min-height:380px;margin:0 -14px 18px;background:linear-gradient(160deg,#17243A,#35608f);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:28px 18px;overflow:hidden;border-radius:0 0 22px 22px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,18,32,.85),rgba(10,18,32,.2))}.hero>*{position:relative;z-index:1}
.hero h1{font-size:2.3rem;letter-spacing:.06em;line-height:1.1}.hero p{margin:0}.hero small{opacity:.85;letter-spacing:.08em;font-size:.72rem}
.cd{display:flex;gap:8px}.cd div{background:rgba(255,255,255,.15);backdrop-filter:blur(6px);border-radius:10px;padding:8px 10px;text-align:center;min-width:56px;font-size:.7rem}.cd b{font-size:1.3rem;display:block}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.btn.co{background:var(--co)}.btn.g{background:rgba(255,255,255,.18);color:#fff}.btn.o{background:none;color:var(--ink);border:1px solid var(--bd)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--bd)}
.mut{color:var(--mut);font-size:.88rem}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 120px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.tile{position:relative;height:110px;border-radius:12px;overflow:hidden;background:var(--sky);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--ink)}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tile span,.tile b{position:relative;z-index:1}.tile span{font-size:1.5rem}.tile.p{color:#fff}.tile.p::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bn{position:relative;height:190px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#17243A,#35608f);color:#fff;margin-bottom:12px}.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.bn::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,18,32,.8),transparent 70%)}.bt{position:absolute;left:14px;bottom:12px;right:14px;z-index:1}.bt small{opacity:.85;letter-spacing:.08em}.bt h2{font-size:1.45rem;line-height:1.2}
.bn.s{height:110px}
.tl{border-left:2px solid var(--sky);margin:14px 0 12px 8px;padding-left:18px}.tl div{position:relative;padding:5px 0}.tl div::before{content:"";position:absolute;left:-25px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--co)}
details{background:var(--sky);border-radius:10px;padding:8px 12px;margin:10px 0}summary{cursor:pointer;font-weight:600}
label{display:block;font-size:.78rem;color:var(--mut);margin:8px 0 2px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.stat{background:var(--sky);border-radius:12px;padding:10px}.stat b{display:block;font-size:1.25rem}.stat span{font-size:.78rem;color:var(--mut)}
.bar{display:grid;grid-template-columns:110px 1fr 74px;gap:8px;align-items:center;font-size:.82rem;margin:5px 0}.bar div{background:var(--sky);border-radius:6px;height:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--co)}.bar b{text-align:right}
.pg{background:var(--sky);border-radius:6px;height:8px;overflow:hidden;margin:6px 0}.pg i{display:block;height:100%;background:var(--co)}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:600;border:1px solid var(--co);color:var(--co)}.badge.Shortlisted{background:var(--sky);color:var(--ink);border-color:var(--sky)}.badge.Booked{background:var(--pri);color:#fff;border-color:var(--pri)}
.x{background:none;border:0;color:var(--co);cursor:pointer;font-size:1.1rem}
.ck{display:flex;gap:10px;align-items:center;padding:6px 0}.ck input{width:20px;height:20px;flex:none}.ck.d span{text-decoration:line-through;opacity:.5}.ck span{flex:1}
.ind{padding:12px;border-radius:12px;background:var(--sky);margin-top:10px;font-weight:600}
.m{columns:2 160px;column-gap:8px}.m figure{margin:0 0 8px;break-inside:avoid;position:relative}.m img{width:100%;display:block;border-radius:10px;cursor:zoom-in}.m figcaption{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;padding:2px 8px;border-radius:99px}.m .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:26px;height:26px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:16px}.lb img{max-width:100%;max-height:80%;border-radius:8px}
#msvg{width:100%;touch-action:none;background:var(--sky);border-radius:12px;cursor:grab}#msvg text{fill:var(--ink);font-size:12px}
a{color:var(--co)}
#app>*{animation:up .45s both}@keyframes up{from{opacity:0;transform:translateY(8px)}}@media(prefers-reduced-motion:reduce){#app>*{animation:none}}
</style></head><body>
